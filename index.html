<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geohash Viewer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <div id="container">
    <div id="map"></div>
    <div id="info">
      <h2>Geohash Info</h2>
      <p><strong>Selected:</strong> <span id="geohash">Click a point</span></p>
      <p><strong>Precision:</strong> <span id="precision-value">6</span></p>
      <label for="precision">Adjust Precision:</label>
      <input type="range" id="precision" min="1" max="12" value="6" />
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/geohash.js"></script>
  <script src="script.js"></script>
</body>
</html>
